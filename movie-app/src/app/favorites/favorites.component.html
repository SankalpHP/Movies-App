<div class="container">
    <div class="row">
        <div class="col-lg-12">
            <span class="d-flex gap-2 mt-2">
                <h1 style="font-family: Ubuntu, sans-serif;font-style: italic;">your favorites</h1>
                <img src="assets/Images/congratulation.png" height="50px" alt="congrats">
            </span>
        </div>
        <div class="col-lg-12">
            <ul class="list-group mt-2" style="cursor: pointer;">
            @if (favMovies?.length != 0) {
                @for (movie of favMovies; track $index) {
                    <li class="list-group-item d-flex justify-content-between align-items-center">
                    <span class="d-flex gap-2 align-items-center" [routerLink]="['/details',movie.Title]">
                        <img [src]="movie.Poster" height="80px" width="60px" alt="congrats">
                        <h6>{{movie.Title}}</h6>
                    </span>
                    <span class="badge">
                        <button class="btn btn-danger" (click)="removefavMovie(movie.Title)">remove</button>
                    </span>
                    </li>
                }
            }@else {
                   <span class="alert alert-warning" style="width: 100%;">
                         No Movie Found!
                   </span>
            }
            </ul>
        </div>
    </div>
</div>


<!-- Message Modal -->  
  <div class="modal fade" id="messageModal" tabindex="-1" aria-labelledby="messageModalLabel">
    <div class="modal-dialog modal-dialog-centered modal-sm">
      <div class="modal-content">
        <div class="modal-header">
          <h1 class="modal-title fs-5" id="messageModalLabel">Modal title</h1>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
            {{message}}
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
        </div>
      </div>
    </div>
  </div>
